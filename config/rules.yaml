# Hard gate for the user's market-impact radar. A fetched item is stored only
# when it has a recognized transmission channel to rates, FX, credit, equities,
# commodities, shipping or energy. General war, human-rights and aid coverage
# is deliberately excluded unless the same item contains a concrete market
# trigger such as sanctions, blockade, oil disruption or military escalation.
