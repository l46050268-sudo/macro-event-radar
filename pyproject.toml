[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "macro-event-radar"
version = "1.4.0"
description = "Official-source-first macro and geopolitical event radar"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "feedparser>=6.0,<7",
  "httpx>=0.27,<1",
  "PyYAML>=6.0,<7",
  "python-dateutil>=2.9,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pyinstaller>=6.10,<7"]

[project.scripts]
macro-radar = "macro_radar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
